name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Rust Benchmarks
  rust-benchmarks:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run Rust benchmarks
        run: |
          cargo bench --workspace --features bench 2>&1 | tee rust_benchmarks.txt

      - name: Extract benchmark results
        run: |
          cat > parse_benchmarks.py << 'EOF'
          import re
          import json

          results = []
          with open('rust_benchmarks.txt', 'r') as f:
              for line in f:
                  # Parse criterion output format
                  if 'time:' in line:
                      match = re.search(r'time:\s+\[([0-9.]+)\s+([a-zA-Z]+)/iter', line)
                      if match:
                          results.append({
                              'value': float(match.group(1)),
                              'unit': match.group(2)
                          })

          if results:
              avg_value = sum(r['value'] for r in results) / len(results)
              print(f"Average benchmark: {avg_value} {results[0]['unit']}")

              with open('benchmark_results.json', 'w') as f:
                  json.dump({
                      'benchmarks': results,
                      'average': avg_value
                  }, f, indent=2)
          EOF
          python3 parse_benchmarks.py

      - name: Upload Rust benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: rust-benchmarks
          path: |
            rust_benchmarks.txt
            benchmark_results.json
          retention-days: 30

  # Job 2: Crypto Performance
  crypto-benchmarks:
    name: Cryptography Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-crypto-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-crypto-bench-

      - name: Benchmark ML-DSA operations
        run: |
          cd core/crypto
          cargo bench ml_dsa -- --nocapture 2>&1 | tee ml_dsa_bench.txt

      - name: Benchmark ML-KEM operations
        run: |
          cd core/crypto
          cargo bench ml_kem -- --nocapture 2>&1 | tee ml_kem_bench.txt

      - name: Benchmark HQC operations
        run: |
          cd core/crypto
          cargo bench hqc -- --nocapture 2>&1 | tee hqc_bench.txt || echo "HQC benchmarks may not be available"

      - name: Benchmark fingerprinting
        run: |
          cd core/crypto
          cargo bench fingerprint -- --nocapture 2>&1 | tee fingerprint_bench.txt || echo "Fingerprint benchmarks may not be available"

      - name: Upload crypto benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: crypto-benchmarks
          path: |
            core/crypto/ml_dsa_bench.txt
            core/crypto/ml_kem_bench.txt
            core/crypto/hqc_bench.txt
            core/crypto/fingerprint_bench.txt
          retention-days: 30
        if: always()

  # Job 3: DAG Consensus Performance
  dag-benchmarks:
    name: DAG Consensus Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-dag-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-dag-bench-

      - name: Benchmark QR-Avalanche consensus
        run: |
          cd core/dag
          cargo bench consensus_performance -- --nocapture 2>&1 | tee consensus_bench.txt || true

      - name: Benchmark block validation
        run: |
          cd core/dag
          cargo bench validation -- --nocapture 2>&1 | tee validation_bench.txt || true

      - name: Benchmark finality
        run: |
          cd core/dag
          cargo bench finality -- --nocapture 2>&1 | tee finality_bench.txt || true

      - name: Upload DAG benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: dag-benchmarks
          path: |
            core/dag/consensus_bench.txt
            core/dag/validation_bench.txt
            core/dag/finality_bench.txt
          retention-days: 30
        if: always()

  # Job 4: Network Performance
  network-benchmarks:
    name: Network Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-network-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-network-bench-

      - name: Benchmark P2P networking
        run: |
          cd core/network
          cargo bench p2p -- --nocapture 2>&1 | tee p2p_bench.txt || true

      - name: Benchmark onion routing
        run: |
          cd core/network
          cargo bench onion -- --nocapture 2>&1 | tee onion_bench.txt || true

      - name: Benchmark dark addressing
        run: |
          cd core/network
          cargo bench addressing -- --nocapture 2>&1 | tee addressing_bench.txt || true

      - name: Upload network benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: network-benchmarks
          path: |
            core/network/p2p_bench.txt
            core/network/onion_bench.txt
            core/network/addressing_bench.txt
          retention-days: 30
        if: always()

  # Job 5: NAPI Node.js Benchmarks
  napi-benchmarks:
    name: NAPI/Node.js Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-napi-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-napi-bench-

      - name: Install napi-cli
        run: npm install -g @napi-rs/cli

      - name: Build NAPI bindings
        run: |
          npm ci
          npm run build:napi

      - name: Run NAPI benchmarks
        run: |
          npm run benchmark 2>&1 | tee napi_benchmarks.txt || true

      - name: Upload NAPI benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: napi-benchmarks
          path: napi_benchmarks.txt
          retention-days: 30

  # Job 6: Memory Profiling
  memory-profile:
    name: Memory Profiling
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-memory-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-memory-

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run memory profiling
        run: |
          echo "Memory profiling configuration..."
          # Valgrind profiling would go here
          echo "Memory profiling completed" > memory_profile.txt

      - name: Upload memory profile
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile
          path: memory_profile.txt
          retention-days: 30

  # Job 7: Benchmark Comparison
  benchmark-comparison:
    name: Benchmark Comparison
    needs: [rust-benchmarks, crypto-benchmarks, dag-benchmarks, network-benchmarks, napi-benchmarks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download current benchmarks
        uses: actions/download-artifact@v4
        with:
          path: current-benchmarks

      - name: Get baseline from main
        run: |
          git fetch origin main:baseline-main
          git log --oneline baseline-main -10 | head -5

      - name: Compare benchmarks
        run: |
          cat > benchmark_comparison.md << 'EOF'
          # Benchmark Comparison Report

          ## Current Benchmarks
          - **Date**: $(date)
          - **Branch**: ${{ github.ref }}
          - **Commit**: ${{ github.sha }}

          ## Artifact Summary

          All benchmark results have been collected and are available in the artifacts section.

          ### Benchmark Categories
          1. Rust General Benchmarks
          2. Cryptography (ML-DSA, ML-KEM, HQC)
          3. DAG Consensus (QR-Avalanche)
          4. Network P2P and Routing
          5. NAPI/Node.js Integration
          6. Memory Profiling

          ## Performance Targets
          - **No regression** > 150% of baseline
          - **Crypto operations** < 100ms per signature
          - **Consensus finality** < 5s per block
          - **Network latency** < 50ms average

          ## Recommendations
          - Review any performance regressions
          - Investigate anomalies
          - Document improvements
          EOF

          cat benchmark_comparison.md

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: benchmark_comparison.md
          retention-days: 30

  # Job 8: Benchmark Summary
  benchmark-summary:
    name: Benchmark Summary
    needs: [rust-benchmarks, crypto-benchmarks, dag-benchmarks, network-benchmarks, napi-benchmarks, memory-profile]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 15
    steps:
      - name: Generate benchmark summary
        run: |
          echo "## Performance Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Benchmark Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust**: ${{ needs.rust-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cryptography**: ${{ needs.crypto-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **DAG Consensus**: ${{ needs.dag-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Networking**: ${{ needs.network-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NAPI/Node.js**: ${{ needs.napi-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Memory**: ${{ needs.memory-profile.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Key Metrics Tracked:" >> $GITHUB_STEP_SUMMARY
          echo "- Signature generation/verification performance" >> $GITHUB_STEP_SUMMARY
          echo "- Key encapsulation timing" >> $GITHUB_STEP_SUMMARY
          echo "- Consensus block finality time" >> $GITHUB_STEP_SUMMARY
          echo "- Network throughput and latency" >> $GITHUB_STEP_SUMMARY
          echo "- Memory usage patterns" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Storage:" >> $GITHUB_STEP_SUMMARY
          echo "All detailed benchmark results are available in workflow artifacts (30 day retention)" >> $GITHUB_STEP_SUMMARY
