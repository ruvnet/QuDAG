name: CI

on:
  push:
    branches: [main, develop, quadag-exchange, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUST_LOG: debug

jobs:
  # Format and lint checks
  lint:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          
      - name: Check formatting
        run: cargo fmt --all -- --check
        
      - name: Run clippy
        run: cargo clippy --all-features --workspace -- -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run security audit
        run: cargo audit
        
      - name: Check for known vulnerabilities
        run: cargo audit --deny warnings

  # Unit and integration tests
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.rust }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust }}-cargo-build-
            
      # bash on every OS: the default Windows shell (pwsh) only reports the exit code of
      # the LAST command, which hid failures of earlier commands in the same step.
      - name: Run tests
        shell: bash
        run: cargo test --workspace --all-features --no-fail-fast
        env:
          RUST_MIN_STACK: 8388608  # 8MB stack for quantum crypto operations

      - name: Run tests (release)
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --workspace --all-features --release --no-fail-fast
        env:
          RUST_MIN_STACK: 8388608
          
      - name: Run doc tests
        run: cargo test --doc --workspace

  # Quantum cryptography tests
  quantum-crypto-tests:
    name: Quantum Crypto Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run quantum crypto tests
        run: |
          cd core/crypto
          # ML-KEM, ML-DSA and HQC are always compiled in; the crate has no features.
          cargo test -- --test-threads=1
          cargo test --test security_tests -- --nocapture
          # tests/timing_tests.rs is quarantined (#41): its wall-clock jitter
          # assertion is not a constant-time test and fails on shared runners.
          
      - name: Test NIST vectors
        run: |
          cd core/crypto
          cargo test nist_test_vectors -- --nocapture

  # DAG consensus tests
  dag-consensus-tests:
    name: DAG Consensus Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run consensus tests
        run: |
          cd core/dag
          cargo test qr_avalanche -- --nocapture
          cargo test byzantine -- --nocapture
          cargo test consensus_performance -- --nocapture

  # Network and P2P tests
  network-tests:
    name: Network Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run network tests
        run: |
          cd core/network
          cargo test onion_routing -- --nocapture
          cargo test nat_traversal -- --nocapture
          cargo test traffic_obfuscation -- --nocapture
          cargo test dark_ -- --nocapture

  # Build the release binary on every platform the Release workflow ships.
  # Mirrors release.yml: native arm64 runner (aws-lc-sys does not build under `cross`).
  build:
    name: Build Binaries
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: qudag-linux-amd64
            exe: qudag
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: qudag-linux-arm64
            exe: qudag
          - os: macos-15
            target: x86_64-apple-darwin
            artifact_name: qudag-macos-amd64
            exe: qudag
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: qudag-macos-arm64
            exe: qudag
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: qudag-windows-amd64.exe
            exe: qudag.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p qudag-cli --bin qudag --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "artifacts/${{ matrix.artifact_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/*

  # WASM builds
  wasm-build:
    name: WASM Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build WASM for web
        working-directory: qudag-wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Build WASM for Node.js
        working-directory: qudag-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-nodejs

      - name: Build WASM for bundlers
        working-directory: qudag-wasm
        run: wasm-pack build --target bundler --out-dir pkg-bundler

      - name: Test WASM in Node.js
        working-directory: qudag-wasm
        run: node test-nodejs.mjs pkg-nodejs

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-packages
          path: |
            qudag-wasm/pkg
            qudag-wasm/pkg-nodejs
            qudag-wasm/pkg-bundler

  # Benchmarks run in performance.yml (Rust-native). The job that used to live
  # here could not run: it built a `bench` feature no crate defines and
  # auto-pushed results to a gh-pages branch that does not exist.

  # Test coverage
  coverage:
    name: Code Coverage
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
        env:
          RUST_MIN_STACK: 8388608

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      # Codecov upload needs a repository token; skipped cleanly when it is not configured.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Docker build (no push)
  docker:
    name: Docker Build
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            qudag/node:latest
            qudag/node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The multi-node "Integration Tests" job was removed: it ran `cargo test` in
  # tests/integration, which has no Cargo.toml (the files there are not part of
  # any crate), and called `monitor-nodes.sh --wait-ready`, an option the script
  # does not have. Tracked in #41.
