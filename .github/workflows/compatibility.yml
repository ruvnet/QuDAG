name: Compatibility Testing

# Scope note: most integration tests, property tests and criterion benches in
# the workspace were written against the v1 APIs and no longer compile after
# the v2 rewrite (release qualification tracked in #17). This workflow checks
# what is expected to work today: the workspace builds, and the library tests
# of the crates that v2 maintains pass. Widen the crate lists as suites are
# repaired.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope'
        required: false
        default: 'basic'
        type: choice
        options:
        - basic
        - extended
        - full

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Library test suites that compile and pass on v2.
  LIB_TEST_CRATES: -p qudag-crypto -p qudag-dag -p qudag-mcp -p qudag-vault-core -p qudag
  # Crates without Unix-only code (protocol RPC uses Unix sockets, MCP system
  # tools use sys_info::boottime), used for the Windows leg.
  PORTABLE_CRATES: -p qudag-crypto -p qudag-dag -p qudag-vault-core

jobs:
  # Quick compatibility check for basic platforms
  basic-compatibility:
    name: Basic Compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.rust }}

    - name: Build workspace
      if: runner.os != 'Windows'
      run: cargo build --locked --workspace

    - name: Test maintained library suites
      if: runner.os != 'Windows'
      run: cargo test --locked ${{ env.LIB_TEST_CRATES }} --lib

    - name: Build and test portable crates
      if: runner.os == 'Windows'
      run: cargo test --locked ${{ env.PORTABLE_CRATES }} --lib

  # Extended compatibility testing for more Rust versions. Toolchains older
  # than 1.78 cannot read the v4 Cargo.lock, and current dependencies need a
  # recent stable, so the old 1.70/1.75/1.80 pins were removed.
  rust-versions:
    name: Rust Version Compatibility
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope != 'basic' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.rust }}

    - name: Build workspace
      run: cargo build --locked --workspace
      continue-on-error: ${{ matrix.rust == 'nightly' }}

    - name: Test maintained library suites
      run: cargo test --locked ${{ env.LIB_TEST_CRATES }} --lib
      continue-on-error: ${{ matrix.rust == 'nightly' }}

  # Cross-compilation testing
  cross-compilation:
    name: Cross Compilation
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'full' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            packages: gcc-arm-linux-gnueabihf
          - target: wasm32-unknown-unknown
            packages: ""

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # gcc-multilib conflicts with the cross gcc packages on ubuntu-24.04, so
    # install only the C toolchain each target needs (pqcrypto builds C code).
    - name: Install cross-compilation tools
      if: matrix.packages != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.packages }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Check crypto compilation
      run: cargo check --locked -p qudag-crypto --target ${{ matrix.target }}
      continue-on-error: ${{ matrix.target == 'wasm32-unknown-unknown' }}

    - name: Check DAG compilation
      run: cargo check --locked -p qudag-dag --target ${{ matrix.target }}
      continue-on-error: ${{ matrix.target == 'wasm32-unknown-unknown' }}

    - name: Check network compilation (skip WASM)
      if: matrix.target != 'wasm32-unknown-unknown'
      run: cargo check --locked -p qudag-network --target ${{ matrix.target }}

  # Feature flag combinations
  feature-combinations:
    name: Feature Combinations
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope != 'basic' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        crate: [qudag-crypto, qudag-dag, qudag-network]
        features:
          - ""
          - "--no-default-features"
          - "--all-features"

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Check with feature combination
      run: cargo check --locked -p ${{ matrix.crate }} ${{ matrix.features }}

  # Security-hardened compilation
  security-flags:
    name: Security Hardened Compilation
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'full' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Test with overflow checks
      run: RUSTFLAGS="-C overflow-checks=on" cargo test --locked -p qudag-crypto --lib

    - name: Test with debug assertions
      run: RUSTFLAGS="-C debug-assertions=on" cargo test --locked -p qudag-crypto --lib

    # Scoped to the core crates; other members still carry missing-docs and
    # dead-code warnings from the v1 code (#17).
    - name: Check core crates with warnings as errors
      run: RUSTFLAGS="-D warnings" cargo check --locked -p qudag-crypto -p qudag-dag

    - name: Build with panic=abort
      run: RUSTFLAGS="-C panic=abort" cargo build --locked -p qudag-crypto

  # Documentation
  docs-and-benchmarks:
    name: Documentation and Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Generate documentation and check intra-doc links
      run: cargo doc --locked --workspace --no-deps --all-features
      env:
        RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

    # Most criterion benches target v1 APIs (#17); report, do not gate.
    - name: Compile benchmarks
      run: cargo bench --locked --workspace --no-run
      continue-on-error: true

  # Minimal versions testing (nightly only)
  minimal-versions:
    name: Minimal Versions
    runs-on: ubuntu-latest
    if: github.event.inputs.test_scope == 'full' || github.event_name == 'schedule'

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Test with minimal versions
      run: cargo +nightly build -Z minimal-versions
      continue-on-error: true

  # Summary of the jobs above
  compatibility-report:
    name: Generate Compatibility Report
    runs-on: ubuntu-latest
    needs: [basic-compatibility, rust-versions, cross-compilation, feature-combinations, security-flags, docs-and-benchmarks]
    if: always()

    steps:
    - name: Summarize results
      run: |
        {
          echo "## Compatibility report"
          echo
          echo "| Job | Result |"
          echo "|-----|--------|"
          echo "| Basic compatibility | ${{ needs.basic-compatibility.result }} |"
          echo "| Rust versions | ${{ needs.rust-versions.result }} |"
          echo "| Cross compilation | ${{ needs.cross-compilation.result }} |"
          echo "| Feature combinations | ${{ needs.feature-combinations.result }} |"
          echo "| Security flags | ${{ needs.security-flags.result }} |"
          echo "| Documentation | ${{ needs.docs-and-benchmarks.result }} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if a required job failed
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
