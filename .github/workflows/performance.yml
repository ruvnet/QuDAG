name: Performance Testing and Regression Detection

# Rust-native benchmark workflow (#36).
#
# The previous version drove the Python v1 harness in benchmarking/ and could
# never pass: it used the retired actions/upload-artifact@v3 and
# download-artifact@v3, built a `performance_optimizations` feature that no
# crate defines, compared against a baseline file that was never committed,
# required a fixed 3.0x speed-up, and pushed a generated feature_flags.json
# straight to main. This version measures the real v2 code paths with the
# repository's own Rust benchmarks and keeps the memory ceiling as a hard gate.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Peak resident memory ceiling for the DAG admission benchmark, in MB.
  MEMORY_LIMIT_MB: 500

jobs:
  bench-build:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Build every criterion benchmark
        run: cargo bench --locked --workspace --no-run

  v2-benchmarks:
    name: v2 benchmarks and memory ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Build benchmark binaries
        run: |
          cargo build --locked --release -p qudag-crypto --example ml_kem_v2_bench
          cargo build --locked --release -p qudag-dag --example v2_admission_bench
      - name: ML-KEM-768 benchmark
        run: |
          mkdir -p bench-results
          ./target/release/examples/ml_kem_v2_bench | tee bench-results/crypto-ml-kem.json
          jq -e '.keygen.p50_ns > 0 and .encapsulate.p50_ns > 0 and .decapsulate.p50_ns > 0' bench-results/crypto-ml-kem.json
      - name: DAG admission benchmark with memory ceiling
        run: |
          /usr/bin/time -v -o bench-results/dag-time.txt \
            ./target/release/examples/v2_admission_bench | tee bench-results/dag-admission.json
          jq -e '.vertices > 0 and .admission_p50_ns > 0' bench-results/dag-admission.json
          peak_kb=$(awk -F': ' '/Maximum resident set size/ {print $2}' bench-results/dag-time.txt)
          peak_mb=$((peak_kb / 1024))
          echo "Peak resident memory: ${peak_mb} MB (limit ${MEMORY_LIMIT_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$peak_mb" -le "$MEMORY_LIMIT_MB"
      - name: Summary
        if: always()
        run: |
          {
            echo '## v2 benchmark results'
            for f in bench-results/*.json; do
              echo "### $(basename "$f")"
              echo '```json'
              cat "$f"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-benchmark-results
          path: bench-results/
