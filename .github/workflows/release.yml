name: Release

# Builds the `qudag` CLI (tools/cli, package qudag-cli) for every platform the
# npm installer (qudag-npm/src/binary-manager.ts) downloads, and attaches the
# archives to the GitHub release under exactly the names it requests:
#
#   qudag-<tag>-<target-triple>.tar.gz          (contains `qudag` / `qudag.exe`)
#   qudag-<tag>-<target-triple>.tar.gz.sha256   (sha256sum format)
#   SHA256SUMS                                  (all archives)
#
# The release is created as a draft and only published after every platform
# built, smoke-tested and uploaded, so a published release is always complete.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build release binaries for (e.g. v1.2.3)'
        required: true
        type: string
      dry_run:
        description: 'Build and package only: checks out the dispatched ref, publishes nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.dry_run && 'dry-' || '' }}${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check tag matches npm version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 5
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - name: Tag must equal v<qudag-npm version>
        timeout-minutes: 2
        shell: bash
        run: |
          NPM_VERSION=$(node -p "require('./qudag-npm/package.json').version")
          if [ "$TAG" != "v$NPM_VERSION" ]; then
            echo "::error::tag $TAG does not match qudag-npm/package.json version v$NPM_VERSION; the npm installer would request a different release"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: qudag
            smoke: true
          # Native arm64 runner: aws-lc-sys (via rustls) does not build under `cross`.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            exe: qudag
            smoke: true
          - os: macos-14
            target: x86_64-apple-darwin
            exe: qudag
            smoke: false
          - os: macos-14
            target: aarch64-apple-darwin
            exe: qudag
            smoke: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: qudag.exe
            smoke: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 5
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - name: Install Rust target
        timeout-minutes: 10
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build qudag CLI
        timeout-minutes: 45
        run: cargo build --release --locked -p qudag-cli --bin qudag --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        timeout-minutes: 2
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.exe }} --version
          ./target/${{ matrix.target }}/release/${{ matrix.exe }} --help > /dev/null

      - name: Package
        timeout-minutes: 5
        run: |
          ARCHIVE="qudag-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${ARCHIVE}" -C "target/${{ matrix.target }}/release" "${{ matrix.exe }}"
          tar -tzf "dist/${ARCHIVE}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"; fi
          cat "${ARCHIVE}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 10
        with:
          name: qudag-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        timeout-minutes: 10
        with:
          path: dist
          pattern: qudag-*
          merge-multiple: true

      - name: Verify and aggregate checksums
        timeout-minutes: 2
        shell: bash
        run: |
          cd dist
          ls -l
          test "$(ls qudag-*.tar.gz | wc -l)" -eq 5
          sha256sum -c *.sha256
          sha256sum qudag-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        timeout-minutes: 10
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --draft \
              --title "QuDAG $TAG" \
              --notes "Prebuilt \`qudag\` CLI binaries used by the npm package \`qudag@${TAG#v}\` (\`npm i qudag\`). Each archive has a \`.sha256\` sidecar; \`SHA256SUMS\` lists all of them."
          fi
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json assets --jq '.assets[].name'
