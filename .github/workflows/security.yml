name: Security Scan

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [main, develop]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/package.json'
      - '**/package-lock.json'
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rust security audit
  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Vulnerabilities fail the job, with no exceptions.
      # Unmaintained-crate warnings are reported here and gated by the stricter
      # `cargo audit --deny warnings` release gate in v2.yml (#17).
      - name: Run cargo audit
        run: cargo audit

      - name: Generate audit report
        if: always()
        run: cargo audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-audit-report
          path: audit-report.json

  # Published npm package (qudag-npm): dependency audit and regression tests
  npm-audit:
    name: npm Package Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qudag-npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build and run regression tests
        run: |
          npm run build
          ./node_modules/.bin/tsc --module commonjs --target es2020 --esModuleInterop --skipLibCheck --outDir test-dist tests/*.test.ts
          node --test test-dist/*.test.js

  # Dependency license check (uses the repository deny.toml)
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  # SAST (Static Application Security Testing)
  sast:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Deny the correctness and suspicious lint groups on shipped code (libs
      # and bins). Test/bench targets are excluded because most still target
      # v1 APIs and do not compile (#17); style lint debt is not gated here.
      - name: Run clippy
        run: |
          cargo clippy --locked --workspace --lib --bins -- \
            -A warnings \
            -D clippy::correctness \
            -D clippy::suspicious

  # Secret scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Create gitleaks config
        run: |
          cat > "$RUNNER_TEMP/gitleaks.toml" << 'EOF'
          title = "QuDAG Secret Scanning"

          [extend]
          useDefault = true

          [[rules]]
          id = "qudag-api-key"
          description = "QuDAG API Key"
          regex = '''qudag_[a-zA-Z0-9]{32,}'''

          [[rules]]
          id = "quantum-private-key"
          description = "Quantum Private Key"
          regex = '''-----BEGIN (ML-DSA|ML-KEM|HQC) PRIVATE KEY-----'''

          [allowlist]
          paths = [
            '''test''',
            '''examples''',
            '''\.md$''',
          ]
          EOF

      # Reviewed false positives are listed by fingerprint in .gitleaksignore.
      - name: Run gitleaks
        run: gitleaks detect --verbose --config "$RUNNER_TEMP/gitleaks.toml"

  # Container scanning (for Docker images)
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t qudag:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qudag:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results
        # Fork PRs get a read-only token; the scan itself still runs.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Fuzzing check
  fuzz-check:
    name: Fuzzing Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run short fuzz tests
        run: |
          cd fuzz
          # Only these targets compile against the v2 APIs; the others
          # (cli, crypto, dag_consensus, input_validation, network,
          # protocol_state, validator) still target v1 and are tracked in #17.
          # A build failure or crash fails the job; it is no longer masked.
          for target in serialization_fuzz protocol_fuzz; do
            echo "Fuzzing $target..."
            cargo +nightly fuzz run $target -- -max_total_time=30
          done

      - name: Check for crashes
        run: |
          crashes=$(find fuzz/artifacts -name 'crash-*' -o -name 'timeout-*' 2>/dev/null | head -20)
          if [ -n "$crashes" ]; then
            echo "Fuzz crashes found:"
            echo "$crashes"
            exit 1
          fi

  # Quantum crypto security tests
  quantum-crypto-audit:
    name: Quantum Crypto Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The former `security-audit` feature no longer exists; the timing and
      # zeroization checks live in the qudag-crypto library tests.
      - name: Run crypto library tests (KEM, signatures, timing, zeroization)
        run: cargo test --locked -p qudag-crypto --lib -- --nocapture

      - name: Run ML-KEM v2 suites
        run: cargo test --locked -p qudag-crypto --test ml_kem_v2 --test ml_kem_tests

  # Generate security report
  security-report:
    name: Generate Security Report
    needs: [rust-audit, npm-audit, license-check, sast, secret-scan, container-scan, fuzz-check, quantum-crypto-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize results
        run: |
          {
            echo "# Security Scan Report"
            echo
            echo "Commit: ${{ github.sha }}"
            echo
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Rust Audit | ${{ needs.rust-audit.result }} |"
            echo "| npm Audit | ${{ needs.npm-audit.result }} |"
            echo "| License Check | ${{ needs.license-check.result }} |"
            echo "| SAST | ${{ needs.sast.result }} |"
            echo "| Secret Scan | ${{ needs.secret-scan.result }} |"
            echo "| Container Scan | ${{ needs.container-scan.result }} |"
            echo "| Fuzzing | ${{ needs.fuzz-check.result }} |"
            echo "| Quantum Crypto | ${{ needs.quantum-crypto-audit.result }} |"
          } | tee SECURITY_SCAN_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: SECURITY_SCAN_REPORT.md

      - name: Fail if a check failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
