# cargo-deny configuration for security advisories
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# cargo-deny v2 config: vulnerabilities are always errors (the removed
# `vulnerability` key). Unmaintained crates are errors only when a workspace
# crate depends on them directly.
unmaintained = "workspace"
# Yanked crates are warnings
yanked = "warn"

# No advisory exceptions. The hickory-proto (RUSTSEC-2026-0118/0119) and rsa
# (RUSTSEC-2023-0071) exceptions were removed on 2026-11-10: libp2p 0.57 pulls
# hickory-proto 0.26, and the unused sqlx dependency (the rsa path) was dropped.
ignore = []

[licenses]
# Allow common open-source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "CC0-1.0",
]
