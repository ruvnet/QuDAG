[package]
name = "qudag-napi-core"
version = "0.1.0"
edition = "2021"
authors = ["rUv <https://github.com/ruvnet>"]
repository = "https://github.com/ruvnet/QuDAG"
license = "MIT OR Apache-2.0"
description = "N-API bindings for QuDAG quantum-resistant DAG and cryptography"

[lib]
crate-type = ["cdylib"]

[dependencies]
# N-API bindings
napi = { version = "2.16", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "2.16"

# QuDAG dependencies (local workspace crates)
qudag-crypto = { path = "../../core/crypto", version = "0.4.0" }
qudag-dag = { path = "../../core/dag", version = "0.4.0" }
qudag-network = { path = "../../core/network", version = "0.4.0" }

# Runtime and utilities
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19"
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
blake3 = "1.5"
futures = "0.3"

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
