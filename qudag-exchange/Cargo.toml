[package]
name = "qudag-exchange"
version = "0.6.0"
authors = ["QuDAG Exchange Team"]
edition = "2021"
license = "MIT"
include = ["/src/**", "/Cargo.toml", "/README.md"]
description = "QuDAG Exchange: Quantum-resistant token exchange with rUv (Resource Utilization Voucher) system"
documentation = "https://docs.rs/qudag-exchange"
repository = "https://github.com/ruvnet/QuDAG"
homepage = "https://ruv.io"
keywords = ["qudag", "exchange", "quantum", "tokens", "blockchain"]
categories = ["cryptography", "finance", "web-programming"]

[dependencies]
# Re-export main modules
qudag-exchange-core = { version = "0.6.0", path = "core" }

# Core QuDAG dependencies
qudag-crypto = { version = "0.6.0", path = "../core/crypto" }
qudag-vault-core = { version = "0.6.0", path = "../core/vault" }
qudag-dag = { version = "0.6.0", path = "../core/dag" }

# Standard dependencies  
thiserror = "1.0"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
[dev-dependencies]
criterion.workspace = true
dashmap = "6.0"
lru.workspace = true
parking_lot.workspace = true
rand.workspace = true
rayon = "1.8"

[[bench]]
name = "exchange_benchmarks"
harness = false
