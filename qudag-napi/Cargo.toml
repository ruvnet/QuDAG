[package]
name = "qudag-napi"
version = "1.0.0"
edition = "2021"
description = "Native Node.js bindings for QuDAG quantum-resistant cryptography"
repository = "https://github.com/ruvnet/QuDAG"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["napi", "quantum-resistant", "cryptography", "nodejs", "native"]
categories = ["cryptography", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js native bindings
napi = { version = "2", features = ["napi9", "serde-json", "async"] }
napi-derive = "2"

# QuDAG crypto (native implementation)
qudag-crypto = { version = "0.4.0", path = "../core/crypto" }

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "sync"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
blake3 = "1.5"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
once_cell = "1.19"
getrandom = "0.2"
rand = "0.8"

# Benchmarking
criterion = { version = "0.5", optional = true }

[build-dependencies]
napi-build = "2"

[features]
default = []
benchmark = ["criterion"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
