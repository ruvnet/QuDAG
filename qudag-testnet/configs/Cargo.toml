[package]
name = "qudag-mcp-standalone"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "qudag-mcp-standalone"
path = "qudag-mcp-standalone-fixed.rs"

[dependencies]
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sysinfo = "0.32"
regex = "1.0"