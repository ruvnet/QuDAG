[package]
name = "qudag-mcp-real-crypto"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "qudag-mcp-real"
path = "qudag-mcp-corrected.rs"

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
warp = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
base64 = "0.22"
hex = "0.4"

# Crypto and hashing
sha2 = "0.10"

# Regex for validation
regex = "1.10"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.10"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Random number generation
rand = "0.8"

# QuDAG crypto library (relative path)
qudag-crypto = { path = "../../core/crypto" }

[features]
default = []