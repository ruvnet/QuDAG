[package]
name = "qudag-mcp-real"
version = "1.0.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web framework
warp = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto and encoding
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

# Utilities
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
sysinfo = "0.31"
rand = "0.8"

[[bin]]
name = "qudag-mcp-real"
path = "src/main_standalone.rs"