[package]
name = "qudag-mcp-real"
version = "1.0.0"
edition = "2021"
authors = ["QuDAG Team"]
description = "QuDAG MCP Real Implementation with Exchange and System Monitoring"

[dependencies]
# QuDAG core dependencies
qudag-crypto = { version = "0.5.0", path = "../../core/crypto" }
qudag-dag = { version = "0.5.0", path = "../../core/dag" }
qudag-network = { version = "0.5.0", path = "../../core/network" }
qudag-vault-core = { version = "0.5.0", path = "../../core/vault" }
qudag-exchange-core = { version = "0.4.0", path = "../../qudag-exchange/core" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Web framework and MCP
warp = "0.3"
tokio-stream = "0.1"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Cryptography (additional)
sha2 = "0.10"
base64 = "0.22"
blake3 = "1.5"
hex = "0.4"

# System monitoring
sysinfo = "0.31"

# Storage
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Lazy static
lazy_static = "1.4"
once_cell = "1.19"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Logging
env_logger = "0.11"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking (libp2p)
libp2p = { version = "0.53", features = ["full"] }
multiaddr = "0.18"

# Configuration
toml = "0.8"
config = "0.13"

# Random
rand = "0.8"
uuid = { version = "1.8", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "qudag-mcp-real"
path = "src/main.rs"